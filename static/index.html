<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>ParkPartner 🎙️</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container { width: 100%; max-width: 400px; text-align: center; }
        h1 { font-size: 28px; margin-bottom: 10px; }
        .subtitle { color: #888; margin-bottom: 30px; }
        .record-btn {
            width: 120px; height: 120px; border-radius: 50%; border: none;
            background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
            color: white; font-size: 16px; font-weight: bold; cursor: pointer;
            margin: 20px auto; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 15px rgba(231, 76, 60, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .record-btn:active { transform: scale(0.95); }
        .record-btn.recording {
            background: linear-gradient(135deg, #2ecc71 0%, #27ae60 100%);
            box-shadow: 0 4px 15px rgba(46, 204, 113, 0.4);
            animation: pulse 1s infinite;
        }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
        .status {
            margin-top: 20px; padding: 15px; background: rgba(255, 255, 255, 0.1);
            border-radius: 10px; min-height: 60px;
        }
        .status.error { background: rgba(231, 76, 60, 0.2); border: 1px solid #e74c3c; }
        .status.success { background: rgba(46, 204, 113, 0.2); border: 1px solid #2ecc71; }
        .conversation { margin-top: 20px; text-align: left; max-height: 300px; overflow-y: auto; }
        .message { padding: 10px 15px; margin: 10px 0; border-radius: 15px; max-width: 80%; }
        .message.user { background: #3498db; margin-left: auto; }
        .message.assistant { background: #2ecc71; }
        .icon { font-size: 24px; margin-bottom: 5px; }
        .spinner {
            display: inline-block; width: 20px; height: 20px;
            border: 3px solid rgba(255,255,255,0.3); border-radius: 50%;
            border-top-color: #fff; animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .play-btn {
            background: #2ecc71; color: #fff; border: none; padding: 10px 20px;
            border-radius: 5px; cursor: pointer; font-size: 16px; margin-top: 10px;
        }
        .localhost-warning {
            background: rgba(241, 196, 15, 0.2);
            border: 1px solid #f1c40f;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
            display: none;
        }
        .localhost-warning a { color: #f1c40f; text-decoration: underline; }

        /* ── Microphone permission modal ── */
        .modal-overlay {
            position: fixed; inset: 0;
            background: rgba(0, 0, 0, 0.6);
            display: none; align-items: center; justify-content: center;
            z-index: 1000; padding: 20px;
        }
        .modal-box {
            background: #2a2a4a; border-radius: 16px;
            padding: 30px 24px; max-width: 300px; width: 100%;
            text-align: center; box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        }
        .modal-box h3 { font-size: 18px; margin-bottom: 12px; }
        .modal-box p { font-size: 14px; color: #aaa; margin-bottom: 24px; line-height: 1.5; }
        .btn-allow {
            background: linear-gradient(135deg, #2ecc71, #27ae60);
            color: #fff; border: none; border-radius: 12px;
            padding: 14px 32px; font-size: 16px; font-weight: 600;
            cursor: pointer; width: 100%;
        }
        .btn-allow:active { transform: scale(0.97); }
    </style>
</head>
<body>
<div class="container">
    <!-- Microphone permission modal -->
    <div id="micModal" class="modal-overlay">
        <div class="modal-box">
            <h3>🎤 Доступ к микрофону</h3>
            <p>Для голосового ввода нужен доступ к микрофону.<br>Нажмите «Разрешить» и подтвердите в Safari.</p>
            <button id="btnAllow" class="btn-allow">Разрешить</button>
        </div>
    </div>

    <div id="localhostWarning" class="localhost-warning">
        ⚠️ <strong>Use localhost for microphone access</strong><br>
        <small>Click here: <a href="http://localhost:8000">localhost:8000</a></small>
    </div>
    <h1>ParkPartner 🎙️</h1>
    <p class="subtitle">Your AI walking companion</p>
    <button class="record-btn" id="recordBtn">
        <span class="icon">🎤</span><br>Hold to Talk
    </button>
    <div class="status" id="status">Ready to record</div>
    <div class="conversation" id="conversation"></div>
</div>

<script>
    const recordBtn = document.getElementById('recordBtn');
    const status = document.getElementById('status');
    const conversation = document.getElementById('conversation');
    const localhostWarning = document.getElementById('localhostWarning');

    // State
    let mediaRecorder = null;
    let activeStream = null;
    let audioChunks = [];
    let isRecording = false;
    let micPermissionGranted = false;

    // Debug: enable with ?debug=true
    const DEBUG = new URLSearchParams(window.location.search).has('debug');

    function debugLog(...args) {
        if (DEBUG) console.log('[DEBUG]', ...args);
    }

    // Show warning if accessed via 0.0.0.0
    if (window.location.hostname === '0.0.0.0' || window.location.hostname === '') {
        localhostWarning.style.display = 'block';
    }

    // ── Microphone permission ────────────────────────────────────
    const micModal = document.getElementById('micModal');
    const ORIGINAL_MODAL_HTML = micModal.innerHTML;

    function showDenialMessage() {
        micModal.innerHTML = `
            <div class="modal-box">
                <h3>🎤❌ Нет доступа к микрофону</h3>
                <p>Без доступа к микрофону Партнёр По Парку Вас не услышит</p>
                <button id="btnDenialOk" class="btn-allow">OK</button>
            </div>
        `;
        document.getElementById('btnDenialOk').addEventListener('click', () => {
            micModal.innerHTML = ORIGINAL_MODAL_HTML;
            document.getElementById('btnAllow').addEventListener('click', btnAllowHandler);
        });
    }

    function btnAllowHandler() {
        navigator.mediaDevices.getUserMedia({ audio: true })
            .then(stream => {
                stream.getTracks().forEach(t => t.stop());
                micModal.style.display = 'none';
                micPermissionGranted = true;
                console.log('[MIC] Permission granted via modal');
            })
            .catch(err => {
                console.error('[MIC] Permission denied:', err);
                showDenialMessage();
            });
    }

    // Try auto-grant (works in headless Chrome with --use-fake-ui-for-media-stream)
    (async () => {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            stream.getTracks().forEach(t => t.stop());
            micPermissionGranted = true;
            console.log('[MIC] Auto-granted (headless/test mode)');
        } catch {
            // Real browser — show modal for user gesture
            micModal.style.display = 'flex';
        }
    })();

    document.getElementById('btnAllow').addEventListener('click', btnAllowHandler);

    // ── Recording ────────────────────────────────────────────────
    async function startRecording() {
        if (!micPermissionGranted) {
            alert('Сначала разрешите микрофон');
            return;
        }

        audioChunks = [];

        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            activeStream = stream;
            mediaRecorder = new MediaRecorder(stream);

            mediaRecorder.ondataavailable = (e) => {
                if (e.data.size > 0) audioChunks.push(e.data);
            };

            mediaRecorder.onstop = () => {
                if (activeStream) {
                    activeStream.getTracks().forEach(t => t.stop());
                    activeStream = null;
                }
                sendAudio();
            };

            mediaRecorder.onerror = (e) => {
                console.error('[REC] Error:', e.error);
                status.textContent = '❌ Ошибка записи';
                status.className = 'status error';
            };

            mediaRecorder.start();
            isRecording = true;
            recordBtn.classList.add('recording');
            recordBtn.innerHTML = '<span class="icon">🔴</span><br>Recording...';
            status.textContent = '🔴 Recording...';
            status.className = 'status';
            debugLog('Recording started');
        } catch (err) {
            micPermissionGranted = false;
            activeStream = null;
            status.textContent = '❌ Нет доступа к микрофону';
            status.className = 'status error';
            console.error('[REC] Error:', err);
        }
    }

    function stopRecording() {
        if (!isRecording) return;
        if (mediaRecorder && mediaRecorder.state !== 'inactive') {
            mediaRecorder.stop();
            isRecording = false;
            recordBtn.classList.remove('recording');
            recordBtn.innerHTML = '<span class="icon">🎤</span><br>Hold to Talk';
            status.textContent = '⏳ Processing...';
            status.className = 'status';
            debugLog('Recording stopped');
        }
    }

    async function sendAudio() {
        if (audioChunks.length === 0) {
            status.textContent = '❌ Нет записи — попробуйте ещё раз';
            status.className = 'status error';
            console.warn('[SEND] No audio chunks');
            return;
        }

        const audioBlob = new Blob(audioChunks, { type: audioChunks[0]?.type || 'audio/webm' });
        debugLog('Blob size:', audioBlob.size);

        try {
            status.innerHTML = '<span class="spinner"></span> Processing...';
            const formData = new FormData();
            formData.append('file', audioBlob, 'recording.webm');

            const response = await fetch('/process', { method: 'POST', body: formData });

            if (!response.ok) {
                const error = await response.json();
                throw new Error(error.detail || 'Server error');
            }

            const audioBlobResponse = await response.blob();
            const audioUrl = URL.createObjectURL(audioBlobResponse);

            addMessage('user', '🎤 Voice message sent');
            playAudioResponse(audioUrl);
        } catch (err) {
            status.textContent = `❌ Error: ${err.message}`;
            status.className = 'status error';
            console.error('[SEND] Error:', err);
        }
    }

    // ── Audio playback ───────────────────────────────────────────
    function playAudioResponse(audioUrl) {
        const audio = new Audio(audioUrl);
        audio.preload = 'auto';
        audio.playsInline = true;

        audio.play()
            .then(() => {
                status.textContent = '✅ Response playing...';
                status.className = 'status success';
            })
            .catch(err => {
                console.error('[AUDIO] play() failed:', err);
                status.innerHTML = `🔊 Response ready<br><button class="play-btn" id="playBtn">▶️ Play</button>`;
                status.className = 'status success';
                document.getElementById('playBtn').onclick = () => {
                    audio.play();
                    status.textContent = '✅ Playing...';
                };
            });

        audio.onended = () => {
            if (!status.innerHTML.includes('play-btn')) {
                status.textContent = '🎤 Ready to record';
                status.className = 'status';
            }
            addMessage('assistant', '🔊 Audio response played');
        };
    }

    function addMessage(role, text) {
        const msg = document.createElement('div');
        msg.className = `message ${role}`;
        msg.textContent = text;
        conversation.appendChild(msg);
        conversation.scrollTop = conversation.scrollHeight;
    }

    // ── Event listeners ──────────────────────────────────────────
    recordBtn.addEventListener('mousedown', startRecording);
    recordBtn.addEventListener('mouseup', stopRecording);
    recordBtn.addEventListener('mouseleave', () => { if (isRecording) stopRecording(); });
    recordBtn.addEventListener('touchstart', (e) => { e.preventDefault(); startRecording(); });
    recordBtn.addEventListener('touchend', (e) => { e.preventDefault(); stopRecording(); });
</script>
</body>
</html>
